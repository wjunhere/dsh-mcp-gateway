name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release manifest and bundle patch
        run: npm run verify:release
      - name: Unit tests (no external servers)
        run: npm run test:unit
      - name: Package contents
        run: npm pack --dry-run
